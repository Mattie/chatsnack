params:
  timeout: 30
  retry:
    max_retries: 0
data: |-
  The object or concept described in phrase_to_pixel_icon will be depicted as a tiny 3-column by 4-row pixel icon.
  <phrase_to_pixel_icon>
  {input}
  </phrase_to_pixel_icon>
questions:
  - name: pixel_01_h
    question: >-
      Hue: For pixel art of the phrase_to_pixel_icon, what hue family should dominate in the top-left pixel of a 3-column by 4-row icon?
      (TOP ROW, LEFTMOST PIXEL)
    choices:
      red: Red, centered near 0 degrees.
      orange: Orange, centered near 30 degrees.
      yellow: Yellow, centered near 60 degrees.
      chartreuse: Chartreuse, centered near 90 degrees.
      green: Green, centered near 120 degrees.
      spring: Spring green, centered near 150 degrees.
      cyan: Cyan, centered near 180 degrees.
      azure: Azure, centered near 210 degrees.
      blue: Blue, centered near 240 degrees.
      violet: Violet, centered near 270 degrees.
      magenta: Magenta, centered near 300 degrees.
      rose: Rose, centered near 330 degrees.
  - name: pixel_01_s
    question: >-
      Saturation: For pixel art of the phrase_to_pixel_icon, should the top-left pixel be vividly saturated rather than muted, for this specific 3-column by 4-row icon?
      (TOP ROW, LEFTMOST PIXEL)
    yes: Yes, vivid color saturation.
    no: No, muted color saturation.
  - name: pixel_01_v
    question: >-
      Brightness: For pixel art of the phrase_to_pixel_icon, should the top-left pixel be bright rather than dark, for this specific 3-column by 4-row icon?
      (TOP ROW, LEFTMOST PIXEL)
    yes: Yes, high brightness.
    no: No, dark or black.
